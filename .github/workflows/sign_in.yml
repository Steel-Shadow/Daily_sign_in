on:
  push:
  schedule:
      - cron: '00 00 * * *'
   
jobs:
  TiebaSignIn:
    runs-on: ubuntu-latest
    environment: tieba
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'oracle'
        java-version: 17
    - name: Cache local Maven repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Build with Maven
      env:
        BDUSS: ${{ secrets.BDUSS }}
        # SCKEY: ${{ secrets.SCKEY }}
      run: |
        cd tieba
        for attempt in 1 2 3; do
          mvn -B -ntp compile org.codehaus.mojo:exec-maven-plugin:3.6.2:java -Dexec.mainClass="top.srcrs.Run" -Dexec.args="${BDUSS} ${SCKEY}" && break
          if [ "$attempt" -eq 3 ]; then
            echo "Maven command failed after ${attempt} attempts."
            exit 1
          fi
          echo "Maven command failed on attempt ${attempt}; retrying..."
          sleep 15
        done

  AkkcloudSignIn:
    runs-on: ubuntu-latest
    environment: akkcloud
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip" # caching pip dependencies

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r akkcloud/requirements.txt

      - name: Sign in
        env:
          # secrets name is case insensitive
          email: ${{ secrets.email }}
          password: ${{ secrets.password }}
        run: |
          cd akkcloud
          python sign_in.py
